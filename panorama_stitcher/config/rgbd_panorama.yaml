panorama_stitcher:
  ros__parameters:
    left_color_topic: /front_left/front_left/color/image_raw
    left_depth_topic: /front_left/front_left/aligned_depth_to_color/image_raw
    left_camera_info_topic: /front_left/front_left/color/camera_info
    right_color_topic: /front_right/front_right/color/image_raw
    right_depth_topic: /front_right/front_right/aligned_depth_to_color/image_raw
    right_camera_info_topic: /front_right/front_right/color/camera_info
    output_topic: /panorama/image_raw
    validity_topic: /panorama/validity
    range_topic: /panorama/range
    pointcloud_topic: /panorama/points
    output_frame_id: panorama_optical_frame
    # Range/validity are large debug images (about 15 MB per frame together).
    # Restore the requested depth panorama at a bounded visualization rate,
    # while leaving the redundant validity image disabled. The driving path
    # continues to consume the full-rate /panorama/points cloud.
    publish_auxiliary_outputs: false
    publish_range_output: true
    publish_validity_output: false
    # Do not rate-limit the metric depth panorama separately. Publication is
    # still subscriber-gated below, and the native RGB-D inputs are 30 Hz.
    auxiliary_output_rate_hz: 0.0
    publish_pointcloud: true
    # Stride 4 samples 2.25x as many panorama pixels as stride 6. The ground
    # node's ROI/cap and voxel filter keep RANSAC and costmap traffic bounded.
    pointcloud_stride: 4
    publisher_best_effort: false
    auxiliary_publisher_best_effort: false
    pointcloud_publisher_best_effort: true
    # Process the newest synchronized RGB-D set as soon as the CUDA worker is
    # free. Zero disables the former 20 Hz cap; the 30 Hz camera inputs become
    # the effective upper bound.
    max_output_rate_hz: 0.0

    # Produce each output only while something subscribes to it. The panorama is
    # about 9 MB per frame and the range image about 12 MB, so an unobserved
    # output would otherwise cost GPU time, PCIe bandwidth and DDS traffic for
    # nobody. This also makes publish_range_output above free when RViz is not
    # showing it. Set false to restore unconditional publishing.
    publish_only_when_subscribed: true
    # Exposure gain is a slowly varying mean ratio, so it is measured on every
    # 4th pixel of the 1080p sources instead of on full-resolution masks.
    exposure_sample_stride: 4
    # Reliable input readers. A best-effort reader was measured to be much
    # worse here: the middleware discarded most 6 MB colour samples before the
    # callback ran (colour input fell to 1-7 Hz while depth stayed near 30 Hz),
    # so the four-stream timestamp match almost never succeeded and the output
    # collapsed to about 1 FPS. Do not set this true without re-measuring
    # input_hz in the node diagnostics.
    input_best_effort: false

    # 2026-08-06 remounted-rig calibration. The left topic is wrapper-rotated
    # by 180 degrees and the right topic is native/upright. Both rotation and
    # translation below come from the remounted rig's joint ChArUco stereo
    # solution (42 common board views, 0.435 px full reprojection RMS). For the
    # current symmetric-mount test, physical roll and vertical/forward baseline
    # are constrained to zero. A small symmetric effective-pitch correction
    # (-0.164/+0.164 deg) reduces the measured 7.54 px CameraInfo/convention
    # offset without treating it as a physical mounting pitch. The calibrated
    # yaw and 0.0634 m lens-center distance are retained. Do not reuse the
    # previous mount's 0.11 m horizontal baseline.
    left_rotation_camera_to_rig: [
      0.8625552969843766, 0.001445420725720489, -0.5059607399819862,
      0.0, 0.9999959194165541, 0.002856772696656394,
      0.5059628046054309, -0.002464124421781315, 0.8625517772555107
    ]
    left_translation_camera_in_rig_m: [
      -0.03169871098000719, 0.0, 0.0
    ]
    right_rotation_camera_to_rig: [
      0.8625249756985842, 0.001445568385372199, 0.5060124273456135,
      0.0, 0.9999959194165542, -0.0028567726966563945,
      -0.5060144921799736, 0.0024640378007599354, 0.8625214560934468
    ]
    right_translation_camera_in_rig_m: [
      0.03169871098000719, 0.0, 0.0
    ]

    # The 2026-08-06 mount has asymmetric physical camera orientation.
    # front_left is rotated by the wrapper; front_right is physically upright.
    # CameraInfo stays native, so principal-point adjustment is per camera.
    input_images_rotated_180: true
    left_input_image_rotated_180: true
    right_input_image_rotated_180: false
    rotate_color_180: false
    rotate_aligned_depth_180: false

    left_fx: 1375.93896484375
    left_fy: 1376.0078125
    # Keep native CameraInfo values here; the node applies the 180-degree
    # principal-point transform exactly once for the wrapper-rotated image.
    left_cx: 962.9755859375
    left_cy: 539.9728393554688
    left_width: 1920
    left_height: 1080
    right_fx: 1369.7860107421875
    right_fy: 1369.6165771484375
    right_cx: 967.3739013671875
    right_cy: 566.1657104492188
    right_width: 1920
    right_height: 1080

    # Keep only a bounded recent history of four 1080p RGB-D streams. Processing
    # always takes the newest synchronized set instead of accumulating latency.
    sync_queue_size: 4
    # Reject the worst ~39-40 ms pairs that visibly duplicate moving objects,
    # while retaining the occasional ~33.4 ms depth frame needed to stay
    # above 20 FPS without hardware synchronization.
    sync_slop_ms: 35.0

    # Keep roughly the native angular sampling for downstream perception.
    projection_scale: 1.0
    projection_model: cylindrical
    # Board 5 center in the remounted rig is 2.974 m forward. Depth-aware color is
    # still used in the overlap; this plane is the stable fallback projection.
    color_reference_plane_z_m: 2.97374063
    depth_scale_m: 0.001
    min_depth_m: 0.20
    max_depth_m: 15.0
    # Board 2 spans beyond the pure rotation-overlap boundary because of the
    # 0.06340 m baseline. Five degrees retains its outer columns while keeping
    # depth reprojection limited to the central band.
    depth_overlap_margin_deg: 5.0
    # The RGB renderer remains smooth, but metric range/validity are built by
    # deprojecting the complete aligned-depth images into the rig frame.
    full_depth_reprojection: true
    use_cuda: true
    # CUDA safety circuit breaker. Normal frames are about 10 ms; three
    # consecutive frames above 150 ms or one 500 ms timeout permanently move
    # this process to the CPU backend without attempting risky CUDA cleanup.
    cuda_timeout_ms: 500
    cuda_slow_frame_ms: 150.0
    cuda_slow_frame_limit: 3

    # Always put the cut inside the actual calibrated overlap. Color is kept
    # independent of sparse depth reprojection; fused depth is the next stage.
    auto_seam_center: true
    seam_angle_deg: 0.0
    # Hard ownership boundary: never average pixels from the two viewpoints.
    # This preserves close moving objects as two clean camera halves instead
    # of ghosting or smearing them inside the overlap.
    seam_feather_px: 0
    # Outside the true binocular overlap, keep the smooth calibrated reference
    # projection. Inside it, reconstruct RGB from aligned depth so objects at
    # different ranges retain their physical width in the common rig frame.
    depth_aware_color: true
    render_depth_reprojected_color: true
    depth_color_overlap_only: true
    # A hard switch between depth-reprojected RGB and the reference-plane RGB
    # must not run through the forward obstacle-detection area. Extend the
    # depth-color band eight degrees beyond the binocular overlap on both
    # sides, while still leaving the peripheral view on the stable 2D warp.
    depth_color_band_margin_deg: 8.0
    # Keep the proven four-stream timestamp queue for stable camera pairing
    # even though the color renderer does not consume depth geometrically.
    use_rgbd_synchronization: true
    # The CUDA filters operate before 3D reprojection. Spatial filtering is
    # edge-aware; temporal history is cleared on invalid depth and changes
    # larger than 8 cm are accepted immediately, avoiding stale silhouettes.
    cuda_depth_spatial_filter: true
    cuda_depth_spatial_delta_m: 0.03
    cuda_depth_spatial_delta_relative: 0.01
    cuda_depth_temporal_filter: true
    cuda_depth_temporal_alpha: 0.65
    cuda_depth_temporal_reset_m: 0.08
    # Do not copy a neighbouring projected RGB sample into a depth hole. Flat
    # surfaces are already covered by the 1 px splat; depth edges use radius 0.
    depth_splat_radius_px: 1
    depth_edge_splat_radius_px: 0
    projected_hole_radius_px: 0
    allow_color_fallback: true
    # Disable the older CPU median/EMA path.
    depth_temporal_stabilization: false
    depth_temporal_alpha: 0.35
    depth_temporal_reset_m: 0.05
    depth_median_kernel: 3
    occlusion_switch_margin_m: 0.05
    # Keep camera ownership spatially coherent in the overlap. Picking the
    # nearest depth independently for every pixel fragments people and other
    # close objects when the two depth maps disagree at their silhouettes.
    prefer_seam_camera_when_both_depth_valid: true
    # Keep one calibration-derived ownership boundary for every frame.
    # A content-aware boundary was visually smoother than a per-row seam, but
    # depth/color noise still made the whole boundary wander across a static
    # object and change its apparent width. A fixed seam is deterministic.
    content_aware_seam: false
    seam_color_weight: 1.0
    seam_depth_weight: 2.0
    seam_foreground_weight: 0.35
    seam_center_weight: 0.10
    seam_temporal_weight: 2.0
    seam_max_step_px: 6

    enable_exposure_compensation: true
    exposure_smoothing: 0.15
    min_exposure_gain: 0.75
    max_exposure_gain: 1.33
    diagnostics_period_sec: 2.0
