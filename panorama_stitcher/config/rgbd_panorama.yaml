panorama_stitcher:
  ros__parameters:
    left_color_topic: /front/front/color/image_raw
    left_depth_topic: /front/front/aligned_depth_to_color/image_raw
    left_camera_info_topic: /front/front/color/camera_info
    right_color_topic: /camera/camera/color/image_raw
    right_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    right_camera_info_topic: /camera/camera/color/camera_info
    output_topic: /panorama/image_raw
    output_frame_id: panorama_optical_frame

    # Calibrated virtual-color optical frames -> panorama_optical_frame.
    # The displayed RealSense images are already rotated 180 degrees, so these
    # matrices intentionally describe those rotated optical frames.
    # 2026-07-30 external recalibration after the camera was moved:
    # optical-axis yaw is -30.00 deg (front/front) and +30.47 deg
    # (camera/camera); right pitch is +2.26 deg. A metric Board 2 + Board 5
    # bundle adjustment estimates the color-lens baseline as 0.11586 m; the
    # approximately 11 cm ruler measurement is validation-only, not imposed.
    left_rotation_camera_to_rig: [
      0.8660254037844387, 0.0, -0.49999999999999994,
      0.0, 1.0, 0.0,
      0.49999999999999994, 0.0, 0.8660254037844387
    ]
    left_translation_camera_in_rig_m: [
      -0.05481567046279521, 0.002380891489614025, 0.01858394254726097
    ]
    right_rotation_camera_to_rig: [
      0.8615756695982157, 0.030948921839358188, 0.5066848426718206,
      -0.012661318395165565, 0.9991393851368948, -0.039499114987100514,
      -0.5074712371877668, 0.02761617832447575, 0.8612260389246649
    ]
    right_translation_camera_in_rig_m: [
      0.05481567046279521, -0.002380891489614025, -0.01858394254726097
    ]

    # realsense_multi rotates the front color/depth streams by 180 degrees.
    # CameraInfo keeps the native principal point, so adjust the intrinsics but
    # do not rotate the already-upright image data a second time.
    input_images_rotated_180: true
    rotate_color_180: false
    rotate_aligned_depth_180: false

    left_fx: 1369.7860107421875
    left_fy: 1369.6165771484375
    left_cx: 967.3739013671875
    left_cy: 566.1657104492188
    left_width: 1920
    left_height: 1080
    right_fx: 1375.93896484375
    right_fy: 1376.0078125
    right_cx: 962.9755859375
    right_cy: 539.9728393554688
    right_width: 1920
    right_height: 1080

    sync_queue_size: 50
    # Reject the worst ~39-40 ms pairs that visibly duplicate moving objects,
    # while retaining the occasional ~33.4 ms depth frame needed to stay
    # above 20 FPS without hardware synchronization.
    sync_slop_ms: 35.0

    # Keep roughly the native angular sampling for downstream perception.
    projection_scale: 1.0
    projection_model: cylindrical
    # Board 2 is the central 7x5 board used as the forward reference plane.
    # Live ChArUco PnP places its center at rig Z=2.635 m. Compensating the
    # calibrated 0.11586 m color-lens baseline at this plane moves the left
    # view outward and the right view outward by about 1.25 deg each
    # (approximately 60 px total), removing the excessive center overlap
    # without blending pixels.
    color_reference_plane_z_m: 2.635
    depth_scale_m: 0.001
    min_depth_m: 0.20
    max_depth_m: 15.0
    # Board 2 spans beyond the pure rotation-overlap boundary because of the
    # 0.11520 m baseline. Five degrees retains its outer columns while keeping
    # depth reprojection limited to the central band.
    depth_overlap_margin_deg: 5.0
    use_cuda: true

    # Always put the cut inside the actual calibrated overlap. Color is kept
    # independent of sparse depth reprojection; fused depth is the next stage.
    auto_seam_center: true
    seam_angle_deg: 0.0
    # Hard ownership boundary: never average pixels from the two viewpoints.
    # This preserves close moving objects as two clean camera halves instead
    # of ghosting or smearing them inside the overlap.
    seam_feather_px: 0
    # Keep the color panorama in one cylindrical projection. A partial
    # depth-reprojected center band introduces two extra hidden cut boundaries
    # and can split objects (the transparent-bottle regression test). Metric
    # RGB-D fusion is produced as a separate, fully depth-consistent output.
    depth_aware_color: false
    # Keep the proven four-stream timestamp queue for stable camera pairing
    # even though the color renderer does not consume depth geometrically.
    use_rgbd_synchronization: true
    # Suppress frame-to-frame depth jitter without freezing real obstacles.
    # Changes above 5 cm are accepted immediately; smaller sensor noise uses
    # an EMA. When both cameras measure the same surface within 5 cm, camera
    # selection is deterministic instead of alternating on noisy z values.
    depth_temporal_stabilization: true
    depth_temporal_alpha: 0.35
    depth_temporal_reset_m: 0.05
    depth_median_kernel: 3
    occlusion_switch_margin_m: 0.05
    # Keep camera ownership spatially coherent in the overlap. Picking the
    # nearest depth independently for every pixel fragments people and other
    # close objects when the two depth maps disagree at their silhouettes.
    prefer_seam_camera_when_both_depth_valid: true

    enable_exposure_compensation: true
    exposure_smoothing: 0.15
    min_exposure_gain: 0.75
    max_exposure_gain: 1.33
    diagnostics_period_sec: 2.0
