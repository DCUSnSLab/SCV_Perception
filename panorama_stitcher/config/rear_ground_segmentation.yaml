rear_ground_segmentation:
  ros__parameters:
    input_topic: /rear/rear/depth/color/points
    obstacle_topic: /rear/obstacle_points
    ground_topic: /rear/ground_points
    publish_ground_cloud: true

    # RealSense optical frame: +X right, +Y down, +Z forward. The rear camera
    # points straight backward with a physical 30 deg downward pitch, so
    # vehicle +Z expressed in rear_color_optical_frame is [0, -cos(30),
    # -sin(30)]. This compensates the mount pitch before applying the road
    # slope tolerance; flat ground is therefore 0 deg, not 30 deg.
    expected_up_vector: [0.0, -0.8660254037844386, -0.5]
    max_ground_tilt_deg: 35.0

    # Keep the same geometry policy as the calibrated front panorama. The rear
    # camera is mounted at the same physical height as the front rig. Score
    # hypotheses on 4,000 samples, then validate the winner on all candidates.
    ransac_iterations: 240
    max_ransac_points: 4000
    ransac_distance_threshold_m: 0.05
    min_ground_inliers: 300
    min_ground_inlier_ratio: 0.03
    # Same two-surface transition handling as the front panorama.
    # Rollback: set iterations to 0 to restore single-plane behavior.
    secondary_ransac_iterations: 60
    secondary_min_ground_inlier_ratio: 0.20
    secondary_min_normal_delta_deg: 4.0
    secondary_max_plane_distance_from_origin_m: 1.80
    ground_candidate_min_range_m: 0.4
    ground_candidate_max_range_m: 8.0
    ground_candidate_min_down_m: 0.35
    ground_candidate_max_down_m: 2.5
    min_plane_distance_from_origin_m: 0.80
    max_plane_distance_from_origin_m: 1.40

    obstacle_min_height_m: 0.10
    obstacle_max_height_m: 2.0
    obstacle_min_range_m: 0.25
    obstacle_max_range_m: 8.0
    # Keep rear behavior unchanged until the front outdoor filter is validated.
    obstacle_radius_filter_radius_m: 0.0
    obstacle_radius_filter_min_neighbors: 0
    # Publish every obstacle point from the source depth cloud, matching the
    # front and ground-cloud output policy.
    obstacle_voxel_size_m: 0.0
    # Sample the organized 1280x720 cloud on a 4x4 grid before finite-point
    # filtering/RANSAC. This keeps centimetre-scale spacing at 8 m while
    # reducing the rear callback from 921,600 to at most 57,600 points.
    input_stride: 4
    skip_when_unsubscribed: true
    diagnostics_period_sec: 2.0
    random_seed: 84
