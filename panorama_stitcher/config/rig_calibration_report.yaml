acceptance_notes:
- The applied camera-only correction keeps physical pitch/roll and vertical/forward baseline constrained to zero.
- The remounted rig's 0.0634 m stereo baseline is retained; the old 0.11 m mount value is not used.
- In the 78-corner same-scene check, the central vertical residual fell from 7.54 px RMS to 0.97 px RMS.
- After the fixed mount was installed, a new 360-corner cylindrical check found the inherited pitch correction stale; the refit reduces vertical seam residual from 6.73 px RMS to 0.58 px RMS.
- The 2026-08-11 LiDAR fit uses Boards 3/4/5 and the floor with 13.7 mm source-balanced plane residual.
- Even/odd LiDAR fits agree within 0.325 degree; their 22.3 mm translation spread is almost entirely vertical and is retained as the current height uncertainty.
- The camera-camera result remains provisional until pose- and distance-varied targets are captured.
