metric_panorama_stitcher:
  ros__parameters:
    left_color_topic: /front/front/color/image_raw
    left_depth_topic: /front/front/aligned_depth_to_color/image_raw
    left_camera_info_topic: /front/front/color/camera_info
    right_color_topic: /camera/camera/color/image_raw
    right_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    right_camera_info_topic: /camera/camera/color/camera_info
    output_topic: /panorama/metric/image_raw
    validity_topic: /panorama/metric/validity
    range_topic: /panorama/metric/range
    output_frame_id: panorama_optical_frame
    publish_auxiliary_outputs: true
    # Reliable keeps RViz/image_view usable without a manual QoS override.
    # Queue depth remains one, so a slow viewer cannot accumulate stale frames.
    publisher_best_effort: false

    # Calibrated virtual-color optical frames -> panorama_optical_frame.
    # The displayed RealSense images are already rotated 180 degrees, so these
    # matrices intentionally describe those rotated optical frames.
    # 2026-07-29 external recalibration after the final mechanical setting:
    # optical-axis yaw is -30.00 deg (front/front) and +29.99 deg
    # (camera/camera); right pitch is +2.39 deg. A metric Board 2 + Board 5
    # bundle adjustment estimates the color-lens baseline as 0.11520 m; the
    # approximately 11 cm ruler measurement is validation-only, not imposed.
    left_rotation_camera_to_rig: [
      0.8660254037844387, 0.0, -0.49999999999999994,
      0.0, 1.0, 0.0,
      0.49999999999999994, 0.0, 0.8660254037844387
    ]
    left_translation_camera_in_rig_m: [
      -0.056019098094160745, 0.00003761548916595835, 0.013406818187775251
    ]
    right_rotation_camera_to_rig: [
      0.8657766000199907, 0.03186198891328858, 0.49941535070551707,
      -0.012675149397975396, 0.999047083975797, -0.041764393772638464,
      -0.5002701464664507, 0.0298284706605363, 0.8653554430940442
    ]
    right_translation_camera_in_rig_m: [
      0.056019098094160745, -0.00003761548916595835, -0.013406818187775251
    ]

    # realsense_multi rotates the front color/depth streams by 180 degrees.
    # CameraInfo keeps the native principal point, so adjust the intrinsics but
    # do not rotate the already-upright image data a second time.
    input_images_rotated_180: true
    rotate_color_180: false
    rotate_aligned_depth_180: false

    left_fx: 1369.7860107421875
    left_fy: 1369.6165771484375
    left_cx: 967.3739013671875
    left_cy: 566.1657104492188
    left_width: 1920
    left_height: 1080
    right_fx: 1375.93896484375
    right_fy: 1376.0078125
    right_cx: 962.9755859375
    right_cy: 539.9728393554688
    right_width: 1920
    right_height: 1080

    sync_queue_size: 50
    # Reject the worst ~39-40 ms pairs that visibly duplicate moving objects,
    # while retaining the occasional ~33.4 ms depth frame needed to stay
    # above 20 FPS without hardware synchronization.
    sync_slop_ms: 35.0

    # Keep roughly the native angular sampling for downstream perception.
    projection_scale: 1.0
    projection_model: cylindrical
    # Metric RGB-D output must not be tied to one calibration plane. Valid
    # depth pixels are deprojected into the rig and rendered from the virtual
    # center. Missing depth falls back to a pure-rotation (infinite-depth)
    # color ray; the validity topic distinguishes that fallback.
    color_reference_plane_z_m: 0.0
    depth_scale_m: 0.001
    min_depth_m: 0.20
    max_depth_m: 15.0
    depth_overlap_margin_deg: 0.0
    full_depth_reprojection: true
    # Expand smooth surfaces by one output pixel to avoid forward-warp holes,
    # but never expand across a measured depth discontinuity.
    depth_discontinuity_abs_m: 0.08
    depth_discontinuity_relative: 0.04
    depth_splat_radius_px: 1
    depth_edge_splat_radius_px: 0
    projected_hole_radius_px: 0
    allow_color_fallback: true
    use_cuda: true

    # Always put the cut inside the actual calibrated overlap.
    auto_seam_center: true
    seam_angle_deg: 0.0
    # Hard ownership boundary: never average pixels from the two viewpoints.
    seam_feather_px: 0
    # Reproject every valid RGB-D pixel from both cameras into the rig-centered
    # virtual camera for the metric range and validity topics.
    depth_aware_color: true
    # Depth-correct only the true two-camera overlap. Outside that band RGB
    # stays in the smooth cylindrical projection, while range/validity retain
    # full-frame metric 3D reprojection.
    render_depth_reprojected_color: true
    depth_color_overlap_only: true
    use_rgbd_synchronization: true
    # Keep the metric path low-latency for moving obstacles. The previous
    # full-resolution CPU median+EMA pass cost about 35-40 ms per frame and
    # also left stale silhouettes. Geometry is stabilized by the CUDA z-buffer
    # and the conservative occlusion switch margin instead.
    depth_temporal_stabilization: false
    depth_temporal_alpha: 0.35
    depth_temporal_reset_m: 0.05
    depth_median_kernel: 1
    occlusion_switch_margin_m: 0.05
    # Keep metric range ownership coherent instead of alternating between
    # cameras pixel-by-pixel when both measure the same output region.
    prefer_seam_camera_when_both_depth_valid: true

    enable_exposure_compensation: true
    exposure_smoothing: 0.15
    min_exposure_gain: 0.75
    max_exposure_gain: 1.33
    diagnostics_period_sec: 2.0
