front_rgbd_fusion:
  ros__parameters:
    # Confirmed physical roles:
    #   left  = front/front, serial 239122073045
    #   right = camera/camera, serial 239122071306
    left_color_topic: /front_left/front_left/color/image_raw
    left_depth_topic: /front_left/front_left/aligned_depth_to_color/image_raw
    left_camera_info_topic: /front_left/front_left/color/camera_info
    right_color_topic: /front_right/front_right/color/image_raw
    right_depth_topic: /front_right/front_right/aligned_depth_to_color/image_raw
    right_camera_info_topic: /front_right/front_right/color/camera_info

    color_output_topic: /parking/front/color_mosaic
    depth_output_topic: /parking/front/depth_mosaic
    pointcloud_output_topic: /parking/front/points
    output_frame_id: front_rgbd_rig_optical_frame

    # Initial installation estimates. RPY order is roll, pitch, yaw in degrees.
    # These are intentionally independent so the mount can be tuned without code.
    left_rotation_rpy_deg: [0.0, 0.0, -32.0]
    left_translation_xyz_m: [-0.055, 0.0, 0.0]
    right_rotation_rpy_deg: [0.0, 0.0, 32.0]
    right_translation_xyz_m: [0.055, 0.0, 0.0]

    # The local RealSense rotation filter rotates color and aligned depth by 180
    # degrees, while CameraInfo remains native. The node corrects cx/cy.
    input_images_rotated_180: true
    rotate_aligned_depth_180: false

    # Preserve every source pixel for driving perception. This matches the
    # proven /panorama/image_raw layout; color and depth use the same seam.
    pixel_preserving_output: true
    # Board-5 homographies measured 1898.4..1903.4 px horizontally and
    # 15.2..21.5 px vertically across the center boundary.
    right_x_offset_px: 1900
    right_y_offset_px: 17

    # Used only when pixel_preserving_output is false.
    projection_scale: 0.5
    seam_angle_deg: 0.0
    seam_feather_px: 4
    # Never overwrite driving color with sparse depth reprojection.
    depth_aware_color: false

    depth_scale_m: 0.001
    min_depth_m: 0.20
    max_depth_m: 15.0
    # aligned_depth is expanded to the 1920x1080 color grid. A stride of 4
    # removes duplicated samples; a 1 px z-buffer splat restores mosaic density.
    depth_projection_stride: 4
    pointcloud_stride: 4
    projection_splat_radius_px: 1

    sync_queue_size: 50
    sync_slop_ms: 45.0
    max_publish_rate_hz: 15.0

    enable_exposure_compensation: true
    exposure_smoothing: 0.15
    min_exposure_gain: 0.75
    max_exposure_gain: 1.33
    diagnostics_period_sec: 2.0
