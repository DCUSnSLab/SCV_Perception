observation_tracker:
  ros__parameters:
    detector_3d_threshold: 0.65
    detector_2d_threshold: 0.70

    observation_box_margin_xy: 0.15
    observation_box_margin_z: 0.10

    near_range: 15.0
    middle_range: 30.0
    far_range: 50.0
    lidar_weak_min_points: 2
    centroid_distance_threshold: 1.25
    lidar.vehicle.near.min_points: 12
    lidar.vehicle.middle.min_points: 8
    lidar.vehicle.far.min_points: 4
    lidar.pedestrian.near.min_points: 6
    lidar.pedestrian.middle.min_points: 4
    lidar.pedestrian.far.min_points: 2
    lidar.cyclist.near.min_points: 8
    lidar.cyclist.middle.min_points: 5
    lidar.cyclist.far.min_points: 3

    camera_iou_threshold: 0.20
    camera_center_distance_threshold: 100.0

    depth_consistency_threshold: 1.5
    occlusion_depth_threshold: 1.0
    min_valid_depth_pixels: 20
    depth_roi_inner_scale: 0.60
    min_depth_support_ratio: 0.15
    # YOLO person depth point must overlap the calibrated 3-D Pedestrian box.
    pedestrian_depth_overlap_margin: 0.35
    pedestrian_depth_overlap_threshold: 0.05

    iou_3d_weight: 1.25
    motion_weight: 0.75
    camera_iou_weight: 0.5
    depth_weight: 0.25
    # 99% chi-square gate for a two-dimensional position measurement.
    mahalanobis_gate: 9.21
    maximum_association_cost: 3.5
    camera_recovery_position_gain: 0.40
    camera_recovery_max_correction: 0.50
    weak_position_gain: 0.25
    # Keep identity internally, but publish unsupported predictions briefly.
    output_prediction_max_misses: 2
    enable_occlusion_reasoning: true
    # Nearer pedestrian must cover this fraction of the hidden pedestrian ROI.
    occlusion_overlap_threshold: 0.45
    occlusion_depth_margin: 0.30
    occlusion_confirmation_frames: 2
    occlusion_max_age: 8
    # Revalidate ego-compensated static tracks every third frame.
    enable_static_fast_path: true
    static_observation_interval: 3
    static_fast_match_distance: 0.75
    static_fast_max_yaw_rate: 0.20
    static_fast_max_ego_delta: 0.75

    tentative_min_hits: 3
    strong_confirmation_hits: 2
    max_miss_count: 6
    recovery_max_age: 3
    weak_observation_max_frames: 4
    history_size: 7
    confidence_decay: 0.15
    min_track_confidence: 0.10
    smoothing_switch_count: 2

    enable_lidar_observation: true
    enable_camera_observation: true
    enable_depth_consistency: true
    enable_observation_state: true
    enable_adaptive_lifecycle: true
    enable_temporal_smoothing: true
    enable_odometry: true
    enable_imu: true
    enable_csv_logging: true
    # Debug markers are expensive and do not affect tracking output.
    enable_debug_visualization: false
    enable_fused_detection_visualization: false

    lidar_points_topic: /velodyne_points
    camera_rgb_topic: /camera/camera/color/image_raw
    camera_detection_topic: /yolo/detections
    camera_info_topic: /camera/camera/color/camera_info
    aligned_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    compressed_depth_topic: /camera/camera/aligned_depth_to_color/image_raw/compressedDepth
    camera_optical_frame: camera_color_optical_frame
    lidar_tolerance_sec: 0.12
    camera_tolerance_sec: 0.15
    depth_tolerance_sec: 0.15
    sensor_cache_size: 8

    csv_output_dir: results/observation_tracker
    debug_marker_topic: /observation_tracker/debug_markers
    fused_detection_marker_topic: /observation_tracker/fused_detection_markers
    observation_marker_alpha: 0.55
    visualization.multimodal_strong_color: [0.10, 0.95, 0.25]
    visualization.lidar_dominant_color: [0.10, 0.55, 1.00]
    visualization.camera_dominant_color: [0.95, 0.75, 0.10]
    visualization.weak_observation_color: [0.95, 0.15, 0.15]
