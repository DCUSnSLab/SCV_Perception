trajectory_recorder:
  ros__parameters:
    odom_topic: /odom
    trajectory_topic: /traversability/trajectory
    world_frame: odom
    base_frame: base_link
    pose_source: odom              # odom or tf
    trajectory_publish_rate: 5.0
    min_pose_distance: 0.03
    max_path_poses: 10000

footprint_generator:
  ros__parameters:
    odom_topic: /odom
    footprint_topic: /traversability/footprint
    traversed_area_topic: /traversability/traversed_area
    world_frame: odom
    robot_width: 0.8
    robot_length: 1.2
    footprint_margin: 0.05
    min_footprint_distance: 0.05
    max_visualized_footprints: 2000

traversability_labeler:
  ros__parameters:
    camera_image_topic: /camera/color/image_raw
    camera_depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/color/camera_info
    odom_topic: /odom
    pointcloud_topic: /velodyne_points  # Reserved for the future LiDAR validator.
    positive_mask_topic: /traversability/positive_mask
    labeled_image_topic: /traversability/labeled_image
    world_frame: odom
    base_frame: base_link
    # Must be an optical frame: +X right, +Y down, +Z forward.
    camera_frame: camera_color_optical_frame
    robot_width: 0.8
    robot_length: 1.2
    footprint_margin: 0.05
    observation_buffer_seconds: 10.0
    observation_buffer_max_frames: 150
    sensor_sync_tolerance: 0.08
    min_traversal_distance: 0.03
    depth_check_enabled: true
    depth_tolerance: 0.25
    save_dataset: false
    save_empty_labels: false
    dataset_root: ~/traversability_dataset

label_visualizer:
  ros__parameters:
    labeled_image_topic: /traversability/labeled_image
    positive_mask_topic: /traversability/positive_mask
    debug_image_topic: /traversability/debug_image
    debug_visualization: true
    overlay_alpha: 0.45
